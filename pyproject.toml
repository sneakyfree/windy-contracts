[project]
name = "windy-loom"
version = "0.1.0"
description = "The Loom — validates and (eventually) generates every Windy platform's bilingual agent-control surface from its manifest. ADR-060 L1."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]
